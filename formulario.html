<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sal y Pimienta - Registrar Receta</title>
    <link rel="stylesheet" href="src/css/inter.css">
    <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
      "firebase/analytics": "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js"
    }
  }
</script>
</head>
<body>

    <div class="container">
        <h1>Sal y Pimienta</h1>
        <h2>Registrar Nueva Receta</h2>

        <form id="formReceta">

            <div class="form-group">
                <label for="nombre">Nombre del platillo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Tacos al Pastor" required>
            </div>

            <div class="form-group">
                <label for="imagenURL">Fotografía del platillo:</label>
                
                <a href="https://console.cloudinary.com" target="_blank" class="btn-cloudinary" style="margin-bottom: 10px; display:block;">
                    1. Subir foto en Cloudinary
                </a>

                <input type="url" id="imagenURL" name="imagenURL" placeholder="2. Pega aquí el link de la imagen (https://...)" required>
            </div>

            <div class="form-group">
                <label for="descripcionCorta">Descripción Corta:</label>
                <input type="text" id="descripcionCorta" name="descripcionCorta" placeholder="Breve frase para tarjetas" required>
            </div>

            <div class="form-group">
                <label for="descripcionLarga">Descripción Larga:</label>
                <textarea id="descripcionLarga" name="descripcionLarga" rows="4" required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tiempoMinutos">Tiempo (minutos):</label>
                    <input type="number" id="tiempoMinutos" name="tiempoMinutos" min="1" placeholder="Ej. 45" required>
                </div>

                <div class="form-group">
                    <label for="regiones">Región:</label>
                    <input type="text" id="regiones" name="regiones" placeholder="Ej. Mexico" value="Mexico" required>
                </div>
            </div>

            <div class="form-group">
                <label for="ingredientes">Ingredientes (Separados por comas):</label>
                <textarea id="ingredientes" name="ingredientes" rows="4" placeholder="Ej. 1kg Carne, 2 Cebollas, Sal" required></textarea>
            </div>

            <div class="form-group">
                <label for="pasos">Pasos de preparación (Uno por línea):</label>
                <textarea id="pasos" name="pasos" rows="6" placeholder="Ej. 1. Cortar la carne&#10;2. Calentar el sartén..." required></textarea>
            </div>

            <div class="form-group">
                <label>Momento del día:</label>
                <div class="checkbox-group">
                    <label class="tag-selector">
                        <input type="checkbox" name="momento" value="Desayuno">
                        <span>Desayuno</span>
                    </label>
                    <label class="tag-selector">
                        <input type="checkbox" name="momento" value="Almuerzo">
                        <span>Almuerzo</span>
                    </label>
                    <label class="tag-selector">
                        <input type="checkbox" name="momento" value="Merienda">
                        <span>Merienda</span>
                    </label>
                    <label class="tag-selector">
                        <input type="checkbox" name="momento" value="Cena">
                        <span>Cena</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Tags Dietéticos:</label>
                <div class="checkbox-group">
                    <label class="tag-selector">
                        <input type="checkbox" name="tags" value="Sin Gluten">
                        <span>Sin Gluten</span>
                    </label>
                    <label class="tag-selector">
                        <input type="checkbox" name="tags" value="Vegetariano">
                        <span>Vegetariano</span>
                    </label>
                    <label class="tag-selector">
                        <input type="checkbox" name="tags" value="Sin Lactosa">
                        <span>Sin Lactosa</span>
                    </label>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">Registrar Receta</button>
        </form>
        <button id="btnLogout" style="background: #e74c3c; float: right; padding: 5px 10px; border: none; color: white; border-radius: 4px; cursor: pointer;">
            Cerrar Sesión
        </button>
        <h1>Sal y Pimienta</h1>
    </div>

    <script type="module" src="src/js/subir_receta.js"></script>
</body>
</html>
