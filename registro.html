<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sal y Pimienta</title>
    <link rel="stylesheet" href="src/css/inter.css">
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/analytics": "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <h1>Sal y Pimienta</h1>
        <h2>Crear Nueva Cuenta</h2>
        <p id="mensajeError" class="error-msg">Error</p>
        <p id="mensajeExito" style="color: #27ae60; text-align: center; display: none; margin-bottom: 10px; background: #d4edda; padding: 10px; border-radius: 5px;">¡Cuenta creada exitosamente!</p>

        <form id="registroForm">
            <div class="form-group">
                <label>Nombre Completo:</label>
                <input type="text" id="nombre" required placeholder="Juan Pérez" minlength="3">
            </div>

            <div class="form-group">
                <label>Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="ejemplo@correo.com">
                <small style="color: #7f8c8d; font-size: 0.85rem;">Este será tu nombre de usuario</small>
            </div>

            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" id="password" required placeholder="Mínimo 6 caracteres" minlength="6">
                <small style="color: #7f8c8d; font-size: 0.85rem;">Mínimo 6 caracteres</small>
            </div>

            <div class="form-group">
                <label>Confirmar Contraseña:</label>
                <input type="password" id="confirmPassword" required placeholder="Repite tu contraseña" minlength="6">
            </div>

            <button type="submit" class="btn-submit">Crear Cuenta</button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: #7f8c8d;">
            ¿Ya tienes cuenta? 
            <a href="login.html" style="color: #27ae60; text-decoration: none; font-weight: bold;">Iniciar Sesión</a>
        </p>
    </div>
    <script type="module" src="src/js/registro.js"></script>
</body>
</html>
