<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando - Sal y Pimienta</title>
    <style>
        body {
            background-color: #b9bbbd; display: flex; justify-content: center;
            align-items: center; height: 100vh; margin: 0; font-family: sans-serif;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #27ae60;
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
</head>
<body>
    <div style="text-align:center">
        <div class="spinner" style="margin:0 auto 20px auto;"></div>
        <p>Verificando sesión...</p>
    </div>

    <script type="module">
        import { auth } from './src/js/firebase.js';
        import { onAuthStateChanged } from "firebase/auth";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Usuario detectado, yendo al formulario");
                window.location.href = "formulario.html";
            } else {
                console.log("No hay usuario, yendo al login");
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
