<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sal y Pimienta</title>
    <link rel="stylesheet" href="src/css/inter.css">
    <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
      "firebase/analytics": "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js"
    }
  }
</script>
</head>
<body>
    <div class="container">
        <h1>Sal y Pimienta</h1>
        <h2>Acceso Administrativo</h2>
        <p id="mensajeError" class="error-msg">Error</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="admin@ejemplo.com">
            </div>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
    </div>
    <script type="module" src="src/js/login.js"></script>
</body>
</html>
